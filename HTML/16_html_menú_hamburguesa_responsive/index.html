<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TravelCanarias</title>
    <style>
        
        /********** GENERAL **********/

        * {
            padding: 0;
            margin: 0;
            text-decoration: none;
        }

        :root{
            --azul_turqueza_principal: #8BDFDD;
            --naranja_menu:#F48F68;
            --amarillo_hover: #FFE394;
            --sadow_menu: 0px 8px 20px rgba(0, 0, 0, 0.2);
        }

        .container{
            max-width: 1440px;
            margin:0 auto;
            padding:0;

        }
        
        header {
            display:block;
            width: 100%;
        }
        
        
        .header_naranja{
            width: 100%;
            height: 50px;
            background-color: var(--naranja_menu);
        }
        
        /************ CABECERA **********/
        
        .header_principal {
            position: relative;
            display: flex; 
            /* justify-content: space-between; */
            /* background-color: var(--azul_turqueza_principal); */
            /* height: 300px; */
            align-items: center;
            /* z-index: 999; */
            margin: auto;
        }
        .logo {
            width: 600px;
            height: auto;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            position: absolute;
           
        }

         .fondo{
            display: block;
            width: 100%;
            max-width: 1440px;
            height: auto;
        }
        
        .search input{
            margin: 20px 20px;
            border: none;
            border-radius: 5px;
            width: 80%;
            height: 20px;            
        }
       
    
        /************** MENÚ ************/
        
        nav .menu {
            position: relative;
            list-style: none;
            display: flex;
            background-color: var(--naranja_menu);
        }

        nav .menu li:hover{
            background-color:var(--amarillo_hover);
            /* transform: scale(1.3); */
            /* font-size: 12px; */
            /* box-shadow: var(--sadow_menu); */
            transition: 0.8s ease;
            cursor: pointer;
            

        }

        nav .menu li:hover a{
            color: var(--naranja_menu);
            transition: 0.8s;
            
        }

        nav .menu a{
            color: white;

        }
       
       .menu li{
            position: relative;
            padding: 20px;
        }
        
        
        /****************** SUB-MENU ***************/
        
        nav .submenu_destinos li a{
            color:white !important;
        }
        
        nav .submenu_destinos{
            position: absolute;
            list-style: none;
            top:100%;
            left: 0px;
            visibility: hidden;
            box-shadow: var(--sadow_menu);
            visibility: hidden;
            width: 200px;
            background-color: var(--naranja_menu);
            opacity: 0;
            transition: all 0.8s ease;
            transform: translateY(10px);
            border-radius: 5px;   
        }

        .dropdown {
            position: relative;
        }

        .dropdown:hover .submenu_destinos{
            opacity: 1;
            visibility: visible;
            transform: translateY(2px);   
        }

        .submenu_destinos a:hover {
            color: var(--naranja_menu) !important;
         }

        .submenu_destinos li:hover a {
            color: var(--naranja_menu) !important;
         }       



    </style>
</head>
<body>
    <div class="container">
        <header>
            <!-- <div class="header_naranja"></div> -->
            <div class="header_principal">
                <img class="fondo" src="portada.jpg" alt="Foto portada">
                <!-- <div class="logo"> -->
                <img class="logo" src="TravelCanarias logo.png" alt="logo_TravelCanarias">
                <!-- </div> -->
                
                <!-- <div class="search">
                    <input type="text" placeholder="   Qué deseas buscar...">
                </div> -->
            </div>

            <nav>
                <ul class="menu">
                    <li><a href="#">Inicio</a></li>
                    <li class="dropdown"><a href="#">Destinos</a>
                        <ul class="submenu_destinos">
                            <li><a href="#">Tenerife</a></li>
                            <li><a href="#">La Palma</a></li>
                            <li><a href="#">La Gomera</a></li>
                        </ul>    
                    </li>
                    <li><a href="">Contactos</a></li>
                </ul>
                
            </nav>
        
        </header>
    </div>
    
</body>
</html>
