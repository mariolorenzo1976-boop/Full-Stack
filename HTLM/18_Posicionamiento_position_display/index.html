<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Position-display</title>
    <style>
       
       *{outline: 1px solid red;}
       
       
       .contenedor{
            display:flex;
            flex-wrap: wrap;
            justify-content:space-between ;
            max-width: 1140px;
            margin: 0 auto;
           
           
       }
       
       
       .caja1{
            
            min-width: 200px;
            min-height: 200px;
            background-color: aqua;
            
            /* Alineamos el texto al centro con display flex, y con justify-content alineamos al medio horizontal y con align-items al medio vertical */
            display: flex;
            justify-content: center;
            align-items: center;
            

        }
        .caja2{
        
            min-width: 200px;
            min-height: 200px;
            background-color:green ;
            
            /* Alineamos el texto al centro con display flex, y con justify-content alineamos al medio horizontal y con align-items al medio vertical */
            display: flex;
            justify-content: center;
            align-items: center;
            

        }
        .caja3{
           
            top:50px;
            right:20px;

            min-width: 200px;
            min-height: 200px;
            background-color: green;
            
            /* Alineamos el texto al centro con display flex, y con justify-content alineamos al medio horizontal y con align-items al medio vertical */
            display: flex;
            justify-content: center;
            align-items: center;
            

        }
        .caja4{
            

            min-width: 200px;
            min-height: 200px;
            background-color: yellow;
            
            /* Alineamos el texto al centro con display flex, y con justify-content alineamos al medio horizontal y con align-items al medio vertical */
            display: flex;
            justify-content: center;
            align-items: center;
            

        }
        .caja5{
            min-width: 200px;
            min-height: 200px;
            background-color: black;
            color:white;
            
            /* Alineamos el texto al centro con display flex, y con justify-content alineamos al medio horizontal y con align-items al medio vertical */
            display: flex;
            justify-content: center;
            align-items: center;
            

        }


    </style>
</head>
<body>
    <div class="contenedor">
        <div class="caja1">Caja1</div>
        <div class="caja2">Caja2</div>
        <!-- <div class="caja3">Caja3</div>
        <div class="caja4">Caja4</div>
        <div class="caja5">Caja5</div> -->
    </div>
</body>
</html>
