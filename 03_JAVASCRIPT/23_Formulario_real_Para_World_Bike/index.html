<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    

</head>

<body>
    <section class="contacto">
        <h2>Contacto World Bike: <span class="confirmation"></span> </h2>

        <form class="contact-form">
            <label for="nombre" class="nombre-label-form">Nombre: </label>
            <input id="nombre" class="input-name-form" type="text" placeholder="nombre">
            <br><br>
            <label for="email" class="email-label-form">email: </label>
            <input id="email" class="input-email-form" type="email" placeholder="email">
            <br><br>
            <label for="textarea" class="Text-label-form">Texto:</label>
            <textarea id="textarea" class="input-text-form" placeholder="mensaje"></textarea>
            <button type="submit">Enviar</button>
        </form>
    </section>

</body>
<script src="script.js"></script>

</html>
